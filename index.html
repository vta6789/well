 <script src="/frontend/navigation.js" defer></script>

 <template id="original-project">
  <div class="original-site" id="original-site">
    <header class="sticky top-0 z-40 glass border-b border-stone-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">

                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">

                    </div>

                    <a href="#sec-about" class="hover:text-brand-600 transition">Giới thiệu</a>
                    <a href="#sec-zones" class="hover:text-brand-600 transition">5 Phân khu</a>

    <main class="flex-grow" id="main">
        <section id="sec-home" class="py-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Hero Header -->
                <div class="grid lg:grid-cols-2 gap-12 items-center mb-16">
                    <div>
                        <span class="px-4 py-1.5 rounded-full text-xs font-bold bg-brand-100 text-brand-800 inline-block mb-4 border border-brand-200">
                            🌿 Sống Khỏe Giữa Thiên Nhiên Bình Mỹ
                        </span>
                        <h1 class="text-4xl sm:text-5xl font-extrabold text-stone-900 leading-tight mb-6">
                            Nơi Tận Hưởng Tuổi Già An Yên, Khỏe Mạnh & Kết Nối
                        </h1>
                        <p class="text-stone-600 text-lg mb-8 leading-relaxed">
                            Mô hình Nông trại Dưỡng lão kết hợp chăm sóc sức khỏe toàn diện. Tận dụng nguồn nông sản sinh thái, không gian xanh mát và mô hình điều dưỡng y tế hiện đại dành cho người cao tuổi.
                        </p>

                        <!-- Metric Cards -->
                        <div class="grid grid-cols-3 gap-4 mb-8">
                            <div class="p-3 bg-white rounded-2xl border border-stone-200 text-center">
                                <span class="text-2xl font-extrabold text-brand-600 block">278+</span>
                                <span class="text-[11px] text-stone-500 font-semibold">Nhu cầu khảo sát</span>
                            </div>
                            <div class="p-3 bg-white rounded-2xl border border-stone-200 text-center">
                                <span class="text-2xl font-extrabold text-brand-600 block">5 trong 1</span>
                                <span class="text-[11px] text-stone-500 font-semibold">Phân khu chức năng</span>
                            </div>
                            <div class="p-3 bg-white rounded-2xl border border-stone-200 text-center">
                                <span class="text-2xl font-extrabold text-brand-600 block">SDG 3-11-12</span>
                                <span class="text-[11px] text-stone-500 font-semibold">Mục tiêu bền vững</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-4">
                            <a href="#sec-packages" class="px-8 py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold shadow-lg shadow-brand-600/30 transition transform hover:-translate-y-0.5 inline-block text-center">
                                Chọn gói <i class="fa-solid fa-arrow-right ml-2"></i>
                            </a>
                            <button data-action="login" class="px-6 py-4 bg-white hover:bg-stone-100 text-stone-800 border border-stone-200 rounded-2xl font-semibold transition">
                                Đăng nhập
                            </button>
                        </div>
                    </div>

                    <div class="relative">
                        <img src="/assets/images/farm.jpg" alt="Nông trại Wellness Farm" class="rounded-3xl shadow-2xl object-cover h-[450px] w-full">
                        <div class="absolute -bottom-6 -left-6 glass p-6 rounded-2xl border border-white/60 shadow-xl hidden sm:flex items-center gap-4 max-w-xs">
                            <div class="w-12 h-12 bg-warm-100 text-warm-600 rounded-xl flex items-center justify-center font-bold text-xl">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-stone-900 text-sm">Chăm Sóc Y Tế 24/7</h4>
                                <p class="text-xs text-stone-500">Đội ngũ y tế túc trực & phục vụ chu đáo.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- GIỚI THIỆU & BỐI CẢNH (ABOUT) -->
                <div id="sec-about" class="pt-16 border-t border-stone-200 mb-20">
                    <div class="text-center max-w-3xl mx-auto mb-12">
                        <span class="text-xs font-bold text-brand-600 uppercase tracking-widest bg-brand-50 px-3 py-1 rounded-full">Bối Cảnh & Tầm Nhìn</span>
                        <h2 class="text-3xl font-bold text-stone-900 mt-3">Mô Hình Làng Sức Khỏe Tại Bình Mỹ</h2>
                        <p class="text-stone-600 mt-2 text-sm">Giải pháp kết hợp giữa dưỡng lão sinh thái, nông nghiệp trải nghiệm và y học dự phòng.</p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-8 mb-12">
                        <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-sm">
                            <div class="w-12 h-12 bg-brand-100 text-brand-700 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </div>
                            <h3 class="text-xl font-bold text-stone-900 mb-2">Bối Cảnh Xã Bình Mỹ</h3>
                            <p class="text-stone-600 text-sm leading-relaxed mb-4">
                                Bình Mỹ sở hữu không gian sinh thái trong lành, phù hợp phát triển mô hình dưỡng lão nghỉ dưỡng. Wellness Farm tiên phong tái định nghĩa khái niệm "Viện dưỡng lão" thành "Nông trại nghỉ dưỡng & kết nối".
                            </p>
                            <span class="text-xs font-bold text-brand-700 bg-brand-50 px-3 py-1 rounded-lg">Không gian xanh 100% sinh thái</span>
                        </div>

                        <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-sm">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-lightbulb"></i>
                            </div>
                            <h3 class="text-xl font-bold text-stone-900 mb-2">Tầm Nhìn & Triết Lý Đột Phá</h3>
                            <p class="text-stone-600 text-sm leading-relaxed mb-4">
                                Giúp người cao tuổi duy trì tinh thần minh mẫn, sống có ý nghĩa thông qua việc tự tay lao động nhẹ nhàng, thu hoạch thực phẩm sạch và sinh hoạt cộng đồng văn minh.
                            </p>
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-lg">Thân - Tâm - Trí An Lạc</span>
                        </div>
                    </div>

                    <!-- 4 Nhóm đối tượng Target -->
                    <h3 class="text-xl font-bold text-stone-900 mb-6 text-center">4 Nhóm Đối Tượng Mục Tiêu (Target Groups)</h3>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-stone-200 hover:border-brand-500 transition">
                            <i class="fa-solid fa-user-nurse text-2xl text-brand-600 mb-3 block"></i>
                            <h4 class="font-bold text-stone-900 text-sm">1. Người Cao Tuổi Tuổi Nghỉ Hưu</h4>
                            <p class="text-xs text-stone-500 mt-2">Cần không gian yên tĩnh, hòa mình cùng thiên nhiên để thư giãn và phục hồi sức khỏe.</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-stone-200 hover:border-brand-500 transition">
                            <i class="fa-solid fa-notes-medical text-2xl text-brand-600 mb-3 block"></i>
                            <h4 class="font-bold text-stone-900 text-sm">2. Người Cần Phục Hồi Thể Trạng</h4>
                            <p class="text-xs text-stone-500 mt-2">Cần chế độ dinh dưỡng cá nhân hóa và theo dõi y tế nhẹ nhàng định kỳ.</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-stone-200 hover:border-brand-500 transition">
                            <i class="fa-solid fa-people-roof text-2xl text-brand-600 mb-3 block"></i>
                            <h4 class="font-bold text-stone-900 text-sm">3. Gia Đình Con Cái Đột Biến Công Việc</h4>
                            <p class="text-xs text-stone-500 mt-2">Gửi gắm ông bà cha mẹ ngắn hạn (ngày/tuần) an tâm tuyệt đối.</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-stone-200 hover:border-brand-500 transition">
                            <i class="fa-solid fa-seedling text-2xl text-brand-600 mb-3 block"></i>
                            <h4 class="font-bold text-stone-900 text-sm">4. Nhóm Yêu Thích Nông Nghiệp Xanh</h4>
                            <p class="text-xs text-stone-500 mt-2">Tham gia trải nghiệm trồng trọt, thu hoạch nông sản hữu cơ cùng gia đình.</p>
                        </div>
                    </div>
                </div>

                <!-- THỰC TRẠNG & VẤN ĐỀ (NEED/PROBLEMS) -->
                <div id="sec-survey" class="mb-20 bg-stone-900 text-white rounded-3xl p-8 sm:p-12 shadow-xl">
                    <div class="max-w-3xl mb-10">
                        <span class="text-xs font-bold text-brand-400 uppercase tracking-widest bg-brand-900/50 px-3 py-1 rounded-full border border-brand-500/30">Thực Trạng Nhu Cầu</span>
                        <h2 class="text-3xl font-bold mt-3">4 Nguyên Nhân Cốt Lõi Cần Giải Quyết</h2>
                        <p class="text-stone-400 text-sm mt-2">Kết quả khảo sát từ 278+ đối tượng người cao tuổi và gia đình tại đô thị.</p>
                    </div>

                    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-stone-800 p-6 rounded-2xl border border-stone-700">
                            <span class="text-red-400 text-2xl font-black block mb-2">01</span>
                            <h4 class="font-bold text-white text-base">Thiếu Không Gian Xanh</h4>
                            <p class="text-xs text-stone-400 mt-2">Đô thị hóa khiến người già gò bó trong 4 bức tường, thiếu môi trường trong lành.</p>
                        </div>
                        <div class="bg-stone-800 p-6 rounded-2xl border border-stone-700">
                            <span class="text-red-400 text-2xl font-black block mb-2">02</span>
                            <h4 class="font-bold text-white text-base">Cô Đơn & Thiếu Kết Nối</h4>
                            <p class="text-xs text-stone-400 mt-2">Con cái bận rộn công việc, thiếu môi trường giao lưu đồng niên lành mạnh.</p>
                        </div>
                        <div class="bg-stone-800 p-6 rounded-2xl border border-stone-700">
                            <span class="text-red-400 text-2xl font-black block mb-2">03</span>
                            <h4 class="font-bold text-white text-base">Sức Khỏe Giảm Sút</h4>
                            <p class="text-xs text-stone-400 mt-2">Thiếu chế độ vận động hợp lý và theo dõi chỉ số y tế định kỳ khoa học.</p>
                        </div>
                        <div class="bg-stone-800 p-6 rounded-2xl border border-stone-700">
                            <span class="text-red-400 text-2xl font-black block mb-2">04</span>
                            <h4 class="font-bold text-white text-base">Lo Lắng Thực Phẩm Sạch</h4>
                            <p class="text-xs text-stone-400 mt-2">Khó tiếp cận nguồn rau củ quả thực sự hữu cơ & an toàn cho người lớn tuổi.</p>
                        </div>
                    </div>
                </div>

                <!-- 5 PHÂN KHU CHỨC NĂNG (ZONES) -->
                <div id="sec-zones" class="pt-10 mb-20">
                    <div class="text-center max-w-3xl mx-auto mb-12">
                        <span class="text-xs font-bold text-brand-600 uppercase tracking-widest bg-brand-50 px-3 py-1 rounded-full">Cơ Sở Hạ Tầng</span>
                        <h2 class="text-3xl font-bold text-stone-900 mt-3">5 Phân Khu Chức Năng Của Wellness Farm</h2>
                        <p class="text-stone-600 mt-2 text-sm">Quy hoạch đồng bộ đáp ứng trọn vẹn sinh hoạt, nghỉ dưỡng và y tế.</p>
                    </div>

                    <div class="grid md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition">
                            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-user-doctor"></i>
                            </div>
                            <h3 class="font-bold text-stone-900 text-lg mb-2">1. Khu Chăm Sóc Sức Khỏe</h3>
                            <p class="text-xs text-stone-600 leading-relaxed">
                                Phòng đo chỉ số y tế, thăm khám bác sĩ, vật lý trị liệu, tư vấn dinh dưỡng và chăm sóc y tế 24/7.
                            </p>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition">
                            <div class="w-12 h-12 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-wheat-awn"></i>
                            </div>
                            <h3 class="font-bold text-stone-900 text-lg mb-2">2. Nông Nghiệp Trải Nghiệm</h3>
                            <p class="text-xs text-stone-600 leading-relaxed">
                                Vườn rau hữu cơ, khu trồng thảo dược, cây ăn trái tự tay chăm sóc và thu hoạch thực phẩm tươi.
                            </p>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-house-chimney-window"></i>
                            </div>
                            <h3 class="font-bold text-stone-900 text-lg mb-2">3. Khu Nghỉ Dưỡng Xanh</h3>
                            <p class="text-xs text-stone-600 leading-relaxed">
                                Bungalow gỗ thoáng mát, phòng nghỉ thiết kế chuẩn an toàn cho người già (tay vịn, sàn chống trượt).
                            </p>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition md:col-span-1 lg:col-span-1">
                            <div class="w-12 h-12 bg-warm-100 text-warm-600 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-person-walking-with-cane"></i>
                            </div>
                            <h3 class="font-bold text-stone-900 text-lg mb-2">4. Khu Vận Động Nhẹ</h3>
                            <p class="text-xs text-stone-600 leading-relaxed">
                                Đường dạo bộ ven hồ, sân tập Yoga, Thiền định, khí công dưới bóng cây xanh mát.
                            </p>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm hover:shadow-md transition md:col-span-2 lg:col-span-2">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center font-bold text-xl mb-4">
                                <i class="fa-solid fa-people-group"></i>
                            </div>
                            <h3 class="font-bold text-stone-900 text-lg mb-2">5. Sinh Hoạt Cộng Đồng & Giao Lưu</h3>
                            <p class="text-xs text-stone-600 leading-relaxed">
                                Câu lạc bộ đọc sách, trà đạo, làm đồ thủ công, giao lưu văn nghệ và thưởng thức ẩm thực thực dưỡng.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- CƠ CHẾ HOẠT ĐỘNG 8 BƯỚC (PROCESS) -->
                <div id="sec-process" class="pt-10 mb-20 bg-brand-50/60 p-8 sm:p-12 rounded-3xl border border-brand-100">
                    <div class="text-center max-w-3xl mx-auto mb-12">
                        <span class="text-xs font-bold text-brand-700 uppercase tracking-widest bg-brand-100 px-3 py-1 rounded-full">Quy Trình Chuẩn Chu Đáo</span>
                        <h2 class="text-3xl font-bold text-stone-900 mt-3">Cơ Chế Hoạt Động 8 Bước Chuẩn Hóa</h2>
                        <p class="text-stone-600 mt-2 text-sm">Khép kín từ khi tiếp nhận đến quá trình phục hồi & đánh giá.</p>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">1</span>
                            <h4 class="font-bold text-stone-800 text-xs">Đánh Giá Ban Đầu</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Đo chỉ số sức khỏe & hồ sơ bệnh lý.</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">2</span>
                            <h4 class="font-bold text-stone-800 text-xs">Cá Nhân Hóa Lộ Trình</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Thiết kế thực đơn & hoạt động phù hợp.</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">3</span>
                            <h4 class="font-bold text-stone-800 text-xs">Trải Nghiệm Vườn</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Lao động nhẹ, trồng củ rau sạch.</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">4</span>
                            <h4 class="font-bold text-stone-800 text-xs">Vận Động Dưỡng Sinh</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Tập Yoga, Thiền & Dạo bộ ngoài trời.</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">5</span>
                            <h4 class="font-bold text-stone-800 text-xs">Dinh Dưỡng Thực Dưỡng</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Bữa ăn hữu cơ từ chính nông trại.</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 text-center">
                            <span class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs inline-flex items-center justify-center mb-2">6</span>
                            <h4 class="font-bold text-stone-800 text-xs">Giao Tiếp Cộng Đồng</h4>
                            <p class="text-[11px] text-stone-500 mt-1">Trà đạo, kết bạn & sinh hoạt CLB.</p>
                        </div>
